<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Offer Tracker</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #172033; background: #f4f6fb; }
    body { max-width: 900px; margin: 40px auto; padding: 0 18px; }
    h1 { margin-bottom: 6px; }
    .note, .card, form { background: white; border: 1px solid #dfe4ee; border-radius: 12px; }
    .note { padding: 14px; color: #46516a; margin: 18px 0; }
    form { padding: 18px; display: grid; gap: 12px; }
    label { display: grid; gap: 5px; font-weight: 600; }
    input, select, textarea, button { font: inherit; padding: 10px; border-radius: 7px; }
    input, select, textarea { border: 1px solid #cbd2df; }
    .checks { display: flex; flex-wrap: wrap; gap: 18px; }
    .checks label { display: flex; align-items: center; gap: 7px; }
    button { border: 0; background: #315ee7; color: white; cursor: pointer; font-weight: 700; }
    button:hover { background: #244bc0; }
    #offers { display: grid; gap: 12px; margin-top: 18px; }
    .card { padding: 16px; }
    .card h2 { font-size: 1.1rem; margin: 0 0 8px; }
    .badges { display: flex; gap: 7px; flex-wrap: wrap; margin: 10px 0; }
    .badge { background: #e9f7ee; color: #176436; padding: 4px 8px; border-radius: 20px; font-size: .85rem; }
    .muted { color: #65708a; }
    a { color: #244bc0; }
  </style>
</head>
<body>
  <h1>Free Offer Tracker</h1>
  <p class="muted">Keep track of legitimate, publicly advertised promotions.</p>

  <div class="note">
    Add offers only when you can verify them on the linked source. Check eligibility,
    terms, expiry dates, and whether an offer is truly free before sharing or relying on it.
  </div>

  <form id="offerForm">
    <label>
      Offer name
      <input name="title" required maxlength="100" placeholder="e.g. Official free sample promotion">
    </label>

    <label>
      Offer type
      <select name="type">
        <option>Free sample</option>
        <option>Bonus</option>
        <option>Spin / game</option>
        <option>Credit / reimbursement</option>
        <option>Gift</option>
        <option>Other</option>
      </select>
    </label>

    <label>
      Official or verified source URL
      <input name="url" type="url" required placeholder="https://example.com/offer">
    </label>

    <label>
      Notes and restrictions
      <textarea name="details" rows="2" maxlength="500" placeholder="Eligibility, expiry, or terms"></textarea>
    </label>

    <div class="checks">
      <label><input name="noDeposit" type="checkbox"> No deposit required</label>
      <label><input name="noShipping" type="checkbox"> No shipping cost</label>
    </div>

    <button type="submit">Add verified offer</button>
  </form>

  <h2>Offers</h2>
  <div class="checks">
    <label><input id="freeOnly" type="checkbox" checked> Show only no-deposit offers</label>
    <label><input id="shippingOnly" type="checkbox" checked> Show only no-shipping offers</label>
  </div>
  <section id="offers" aria-live="polite"></section>

  <script>
    const storageKey = "free-offer-tracker-v1";
    const form = document.querySelector("#offerForm");
    const list = document.querySelector("#offers");
    const freeOnly = document.querySelector("#freeOnly");
    const shippingOnly = document.querySelector("#shippingOnly");

    function loadOffers() {
      try { return JSON.parse(localStorage.getItem(storageKey) || "[]"); }
      catch { return []; }
    }

    let offers = loadOffers();

    function render() {
      list.replaceChildren();

      const visible = offers.filter(offer =>
        (!freeOnly.checked || offer.noDeposit) &&
        (!shippingOnly.checked || offer.noShipping)
      );

      if (!visible.length) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = "No matching offers yet. Add one after verifying its source and terms.";
        list.append(empty);
        return;
      }

      for (const offer of visible) {
        const card = document.createElement("article");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = offer.title;

        const type = document.createElement("p");
        type.className = "muted";
        type.textContent = offer.type;

        const badges = document.createElement("div");
        badges.className = "badges";
        if (offer.noDeposit) badges.append(makeBadge("No deposit"));
        if (offer.noShipping) badges.append(makeBadge("No shipping"));

        const details = document.createElement("p");
        details.textContent = offer.details || "No notes provided.";

        const link = document.createElement("a");
        link.href = offer.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "View source";

        card.append(title, type, badges, details, link);
        list.append(card);
      }
    }

    function makeBadge(text) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = text;
      return badge;
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const data = new FormData(form);
      const url = new URL(data.get("url"));

      if (url.protocol !== "https:") {
        alert("Please enter a secure HTTPS source URL.");
        return;
      }

      offers.unshift({
        title: String(data.get("title")).trim(),
        type: String(data.get("type")),
        url: url.href,
        details: String(data.get("details")).trim(),
        noDeposit: data.has("noDeposit"),
        noShipping: data.has("noShipping")
      });

      localStorage.setItem(storageKey, JSON.stringify(offers));
      form.reset();
      render();
    });

    freeOnly.addEventListener("change", render);
    shippingOnly.addEventListener("change", render);
    render();
  </script>
</body>
</html>
